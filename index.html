<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14251f">
  <title>Un árbol hecho de palabras</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap');

    :root {
      color-scheme: dark;
      --forest: #14251f;
      --paper: #f3ead7;
      --gold: #d7b76b;
      --muted: #a6b0a5;
      --line: rgba(243, 234, 215, .18);
      font-family: 'DM Sans', sans-serif;
      background: var(--forest);
      color: var(--paper);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background-color: var(--forest);
      background-image:
        radial-gradient(ellipse at 50% 40%, rgba(84, 111, 76, .23), transparent 58%),
        repeating-linear-gradient(118deg, transparent 0 17px, rgba(255, 255, 255, .012) 18px, transparent 19px);
    }

    .page {
      width: min(100% - 32px, 760px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header { text-align: center; }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 34px;
      font-weight: 500;
      line-height: 1.1;
    }

    .tree-stage {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 380px;
      display: grid;
      place-items: center;
      padding: 29px 0 18px;
      overflow: hidden;
    }

    .tree-art {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--paper);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.05;
      text-align: center;
      text-shadow: 0 0 18px rgba(215, 183, 107, .14);
    }

    .star {
      margin-bottom: 5px;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 29px;
      line-height: 1;
      text-shadow: 0 0 18px rgba(215, 183, 107, .55);
    }

    .tree-row { white-space: pre; }
    .tree-row:nth-of-type(3n) { color: #d8c99e; }

    .trunk {
      margin-top: 4px;
      color: var(--gold);
      font-size: 14px;
      letter-spacing: .18em;
      line-height: .9;
    }

    .controls {
      width: min(100%, 560px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 135px auto auto;
      align-items: end;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      height: 40px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 3px;
      outline: none;
      background: rgba(4, 14, 11, .26);
      color: var(--paper);
      font: 14px 'DM Sans', sans-serif;
    }

    input[type="text"]:focus { border-color: var(--gold); }

    input[type="range"] {
      width: 100%;
      height: 40px;
      margin: 0;
      accent-color: var(--gold);
    }

    button {
      height: 40px;
      padding: 0 13px;
      border: 1px solid rgba(215, 183, 107, .5);
      border-radius: 3px;
      background: transparent;
      color: var(--paper);
      font: 500 12px 'DM Sans', sans-serif;
      white-space: nowrap;
      cursor: pointer;
    }

    button:hover { background: rgba(215, 183, 107, .12); }
    button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    .status {
      min-height: 16px;
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 580px) {
      .page { padding-top: 22px; }
      h1 { font-size: 30px; }
      .tree-stage { min-height: 350px; padding: 24px 0 14px; }
      .tree-art { font-size: 15px; }
      .controls { grid-template-columns: minmax(0, 1fr) 100px; }
      .controls button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">Una felicitación diferente</p>
      <h1>Un árbol hecho de palabras</h1>
    </header>

    <section class="tree-stage" aria-label="Árbol de Navidad hecho con texto">
      <div class="tree-art" id="tree" aria-live="polite"></div>
    </section>

    <form class="controls" id="controls">
      <label>Tu frase
        <input id="phrase" type="text" value="Feliz Navidad" maxlength="24" autocomplete="off">
      </label>
      <label for="density">Ramas <span id="density-value">13</span>
        <input id="density" type="range" min="9" max="17" value="13">
      </label>
      <button id="copy" type="button">Copiar texto</button>
      <button id="download" type="button">Guardar .txt</button>
    </form>
    <p class="status" id="status" aria-live="polite"></p>
  </main>

  <script>
    const phraseInput = document.querySelector('#phrase');
    const densityInput = document.querySelector('#density');
    const densityValue = document.querySelector('#density-value');
    const tree = document.querySelector('#tree');
    const status = document.querySelector('#status');

    function makeTree() {
      const phrase = phraseInput.value.trim().replace(/\s+/g, ' ') || 'Feliz Navidad';
      const words = phrase.split(' ');
      const branchCount = Number(densityInput.value);
      const rows = [];
      let wordIndex = 0;

      for (let branch = 0; branch < branchCount; branch += 1) {
        const targetLength = 4 + Math.round((branch / (branchCount - 1)) * 29);
        let line = '';
        while (line.length < targetLength) {
          const word = words[wordIndex % words.length];
          line += `${line ? ' ' : ''}${word}`;
          wordIndex += 1;
        }
        rows.push(line);
      }

      tree.replaceChildren();
      const star = document.createElement('span');
      star.className = 'star';
      star.setAttribute('aria-hidden', 'true');
      star.textContent = '✦';
      tree.append(star);

      rows.forEach((line) => {
        const row = document.createElement('span');
        row.className = 'tree-row';
        row.textContent = line;
        tree.append(row);
      });

      const trunk = document.createElement('span');
      trunk.className = 'trunk';
      trunk.setAttribute('aria-hidden', 'true');
      trunk.textContent = '▰';
      tree.append(trunk);
      densityValue.textContent = String(branchCount);
      status.textContent = '';
      return ['✦', ...rows, '▰'].join('\n');
    }

    let treeText = makeTree();
    phraseInput.addEventListener('input', () => { treeText = makeTree(); });
    densityInput.addEventListener('input', () => { treeText = makeTree(); });
    document.querySelector('#controls').addEventListener('submit', (event) => event.preventDefault());

    document.querySelector('#copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(treeText);
        status.textContent = 'Texto copiado.';
      } catch {
        status.textContent = 'No se pudo copiar. Puedes seleccionar el texto para copiarlo.';
      }
    });

    document.querySelector('#download').addEventListener('click', () => {
      const file = new Blob([treeText], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(file);
      link.download = 'arbol-de-navidad.txt';
      link.click();
      URL.revokeObjectURL(link.href);
      status.textContent = 'Archivo guardado.';
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080809">
  <title>Feliz Navidad, mi amor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Great+Vibes&display=swap');

    :root {
      color-scheme: dark;
      --gold: #f4c84e;
      --cream: #fff3c4;
      --muted: #a89ba4;
      font-family: 'DM Sans', sans-serif;
      background: #250719;
      color: var(--cream);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      padding: 10px;
      background-color: #250719;
      background-image: repeating-linear-gradient(135deg, rgba(237, 34, 128, .06) 0 1px, transparent 1px 15px);
    }

    .scene {
      position: relative;
      width: min(100%, 1500px);
      min-height: calc(100svh - 20px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(229, 44, 128, .25);
      border-radius: 14px;
      background: #070809;
      box-shadow: 0 0 48px rgba(224, 18, 110, .13), inset 0 0 80px rgba(19, 40, 31, .12);
    }

    #lights {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .composition {
      position: relative;
      z-index: 1;
      min-height: calc(100svh - 20px);
      padding: 16px 18px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .tree-space {
      width: 100%;
      height: min(53svh, 470px);
      min-height: 280px;
      flex: none;
    }

    .dedication { margin-top: 5px; }

    h1 {
      max-width: 92vw;
      margin: 0;
      color: var(--gold);
      font-family: 'Great Vibes', 'Brush Script MT', cursive;
      font-size: 46px;
      font-weight: 400;
      line-height: 1.16;
      text-shadow: 0 0 18px rgba(241, 185, 56, .28);
    }

    .subtitle {
      margin: 5px 0 0;
      color: rgba(255, 243, 196, .7);
      font-family: Georgia, serif;
      font-size: 13px;
    }

    .subtitle span { color: var(--gold); }

    .personalize {
      margin-top: 20px;
      display: grid;
      justify-items: center;
      gap: 6px;
    }

    .personalize label {
      color: var(--muted);
      font-size: 10px;
    }

    .personalize input {
      width: min(260px, 76vw);
      height: 34px;
      padding: 0 8px;
      border: 0;
      border-bottom: 1px solid rgba(255, 243, 196, .27);
      border-radius: 0;
      outline: none;
      background: transparent;
      color: var(--cream);
      font: 14px 'DM Sans', sans-serif;
      text-align: center;
    }

    .personalize input:focus { border-color: var(--gold); }
    .personalize input:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    @media (max-width: 580px) {
      body { padding: 0; }
      .scene { min-height: 100svh; border: 0; border-radius: 0; }
      .composition { min-height: 100svh; padding: 12px 14px 22px; }
      .tree-space { height: 48svh; min-height: 270px; max-height: 390px; }
      h1 { max-width: 96vw; font-size: 38px; }
    }

    @media (max-height: 620px) {
      .tree-space { height: 42svh; min-height: 210px; }
      .personalize { margin-top: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <canvas id="lights" aria-hidden="true"></canvas>
    <div class="composition">
      <div class="tree-space" aria-hidden="true"></div>
      <section class="dedication" aria-live="polite">
        <h1>Feliz Navidad, <span id="recipient">mi amor</span></h1>
        <p class="subtitle">iluminas mi vida <span>✦</span></p>
      </section>
      <form class="personalize" id="personalize">
        <label for="recipient-input">Para</label>
        <input id="recipient-input" type="text" value="mi amor" maxlength="28" autocomplete="off">
      </form>
    </div>
  </main>

  <script>
    const scene = document.querySelector('#scene');
    const canvas = document.querySelector('#lights');
    const context = canvas.getContext('2d');
    const recipientInput = document.querySelector('#recipient-input');
    const recipient = document.querySelector('#recipient');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const colors = ['#ffd34e', '#fff4bd', '#e9435a', '#69b6ec', '#50c98a'];
    let width = 0;
    let height = 0;
    let pixelRatio = 1;
    let bulbs = [];
    let snow = [];

    function randomGenerator(seed) {
      return () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };
    }

    function resizeCanvas() {
      const bounds = scene.getBoundingClientRect();
      width = bounds.width;
      height = bounds.height;
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      const random = randomGenerator(2025);
      const treeHeight = Math.min(height * 0.48, width * 0.94);
      const halfWidth = treeHeight * 0.43;
      bulbs = Array.from({ length: 420 }, () => {
        const progress = 0.03 + random() * 0.97;
        const offset = (random() * 2 - 1) * halfWidth * progress;
        const colorPick = random();
        const colorIndex = colorPick < 0.62 ? 0 : colorPick < 0.79 ? 1 : colorPick < 0.87 ? 2 : colorPick < 0.94 ? 3 : 4;
        return {
          x: offset,
          y: progress * treeHeight,
          color: colors[colorIndex],
          radius: 1 + random() * 1.2,
          phase: random() * Math.PI * 2
        };
      });

      snow = Array.from({ length: Math.max(26, Math.round(width * height / 14500)) }, () => ({
        x: random() * width,
        y: random() * height,
        radius: 0.5 + random() * 1.1,
        drift: (random() - 0.5) * 0.25,
        speed: 0.12 + random() * 0.3,
        alpha: 0.15 + random() * 0.42
      }));
    }

    function drawStar(x, y, outerRadius, innerRadius, time) {
      context.save();
      context.translate(x, y);
      context.rotate(Math.sin(time * 0.0007) * 0.08);
      context.beginPath();
      for (let point = 0; point < 10; point += 1) {
        const angle = -Math.PI / 2 + point * Math.PI / 5;
        const radius = point % 2 === 0 ? outerRadius : innerRadius;
        const pointX = Math.cos(angle) * radius;
        const pointY = Math.sin(angle) * radius;
        if (point === 0) context.moveTo(pointX, pointY);
        else context.lineTo(pointX, pointY);
      }
      context.closePath();
      context.shadowColor = '#ffd34e';
      context.shadowBlur = 22;
      context.fillStyle = '#fff3b1';
      context.fill();
      context.restore();
    }

    function draw(time = 0) {
      context.clearRect(0, 0, width, height);
      const centerX = width / 2;
      const treeHeight = Math.min(height * 0.48, width * 0.94);
      const treeTop = height * 0.075;
      const halfWidth = treeHeight * 0.43;
      const rotation = reducedMotion ? 1 : Math.cos(time * 0.00035);

      context.save();
      context.translate(centerX, 0);
      context.scale(rotation, 1);
      context.translate(-centerX, 0);
      context.lineWidth = 1;
      context.strokeStyle = 'rgba(95, 119, 73, .27)';
      for (let strand = -0.9; strand <= 0.9; strand += 0.3) {
        context.beginPath();
        for (let step = 0; step <= 50; step += 1) {
          const progress = step / 50;
          const x = centerX + strand * progress * halfWidth + Math.sin(progress * 10 + strand * 4) * progress * 5;
          const y = treeTop + progress * treeHeight;
          if (step === 0) context.moveTo(x, y);
          else context.lineTo(x, y);
        }
        context.stroke();
      }

      for (let level = 1; level < 9; level += 1) {
        const progress = level / 9;
        const spread = halfWidth * progress;
        const y = treeTop + treeHeight * progress;
        context.beginPath();
        context.moveTo(centerX - spread, y - 9);
        context.quadraticCurveTo(centerX, y + 14, centerX + spread, y - 9);
        context.strokeStyle = 'rgba(137, 108, 48, .24)';
        context.stroke();
      }

      bulbs.forEach((bulb) => {
        const pulse = reducedMotion ? 0.8 : 0.48 + (Math.sin(time * 0.0018 + bulb.phase) + 1) * 0.26;
        context.globalAlpha = pulse;
        context.shadowColor = bulb.color;
        context.shadowBlur = 5 + pulse * 8;
        context.fillStyle = bulb.color;
        context.beginPath();
        context.arc(centerX + bulb.x, treeTop + bulb.y, bulb.radius, 0, Math.PI * 2);
        context.fill();
      });
      context.globalAlpha = 1;
      context.shadowBlur = 0;

      drawStar(centerX, treeTop - 5, 11, 4, time);
      context.restore();

      snow.forEach((flake) => {
        context.globalAlpha = flake.alpha;
        context.fillStyle = '#fff6dc';
        context.beginPath();
        context.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
        context.fill();
        if (!reducedMotion) {
          flake.y = (flake.y + flake.speed) % height;
          flake.x += flake.drift;
          if (flake.x < 0) flake.x = width;
          if (flake.x > width) flake.x = 0;
        }
      });
      context.globalAlpha = 1;

      if (!reducedMotion) window.requestAnimationFrame(draw);
    }

    recipientInput.addEventListener('input', () => {
      recipient.textContent = recipientInput.value.trim() || 'mi amor';
    });
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    draw();
  </script>
</body>
</html>
